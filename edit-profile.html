<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | Outpost</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            min-height: 100vh;
        }

        nav {
            background: rgba(17, 17, 17, 0.95);
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 25px;
            font-size: 15px;
        }

        .edit-container {
            max-width: 650px;
            margin: auto;
            padding: 60px 6%;
        }

        .edit-box {
            background: #191919;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 35px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input,
        textarea {
            width: 100%;
            padding: 14px;
            background: #111;
            border: 1px solid #444;
            border-radius: 5px;
            color: #fff;
            font-size: 16px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #fff;
        }

        .save-button {
            width: 100%;
            padding: 15px;
            background: #fff;
            color: #111;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-button:hover {
            background: #ddd;
        }

        .cancel {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #aaa;
            text-decoration: none;
        }

        .cancel:hover {
            color: #fff;
        }

        @media (max-width: 600px) {

            .edit-container {
                padding: 40px 5%;
            }

            .edit-box {
                padding: 30px 20px;
            }

        }

    </style>

</head>

<body>

    <nav>

        <div class="logo">Outpost</div>

        <div>

            <a href="index.html">Home</a>
            <a href="profile.html">Profile</a>

        </div>

    </nav>


    <main class="edit-container">

        <div class="edit-box">

            <h1>Edit Profile</h1>

            <form id="profileForm">

                <div class="form-group">

                    <label for="displayName">
                        Display Name
                    </label>

                    <input
                        type="text"
                        id="displayName"
                        placeholder="Your name"
                        maxlength="50"
                    >

                </div>


                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="username"
                        maxlength="30"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="bio">
                        Bio
                    </label>

                    <textarea
                        id="bio"
                        placeholder="Tell people a little about yourself..."
                        maxlength="160"
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="save-button"
                >
                    Save Profile
                </button>

            </form>


            <a href="profile.html" class="cancel">
                Cancel
            </a>

        </div>

    </main>

</body>

</html>
