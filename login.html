<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log In | Outpost</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            min-height: 100vh;
        }

        /* Navigation */

        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(17, 17, 17, 0.95);
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 25px;
            font-size: 15px;
        }

        nav a:hover {
            color: #aaa;
        }

        /* Login */

        .login-container {
            min-height: calc(100vh - 75px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 50px 20px;
        }

        .login-box {
            width: 100%;
            max-width: 450px;
            background: #191919;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 40px;
        }

        .login-box h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 36px;
        }

        .intro {
            text-align: center;
            color: #aaa;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            background: #111;
            border: 1px solid #444;
            border-radius: 5px;
            color: #fff;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #fff;
        }

        .login-button {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            background: #fff;
            color: #111;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            background: #ddd;
        }

        .signup-link {
            text-align: center;
            margin-top: 25px;
            color: #aaa;
        }

        .signup-link a {
            color: #fff;
            text-decoration: none;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        /* Mobile */

        @media (max-width: 600px) {

            nav {
                padding: 15px 5%;
            }

            nav a {
                margin-left: 10px;
                font-size: 13px;
            }

            .login-box {
                padding: 30px 20px;
            }

            .login-box h1 {
                font-size: 30px;
            }

        }

    </style>

</head>

<body>

    <!-- Navigation -->

    <nav>

        <div class="logo">Outpost</div>

        <div>

            <a href="index.html">Home</a>
            <a href="index.html#gallery">Photos</a>
            <a href="index.html#about">About</a>

        </div>

    </nav>


    <!-- Login -->

    <main class="login-container">

        <div class="login-box">

            <h1>Welcome Back</h1>

            <p class="intro">
                Log in to your Outpost account.
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Log In
                </button>

            </form>


            <p class="signup-link">

                Don't have an account?

                <a href="signup.html">Create Account</a>

            </p>

        </div>

    </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    const SUPABASE_URL = "https://atidbmhwrslvylvnjvym.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_YHJV9Kmt5N8uJ23f28ufRA_lFs3GGHg";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

    const loginForm = document.getElementById("loginForm");

    loginForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            alert(error.message);
            return;
        }

        alert("Welcome back to Outpost!");

        window.location.href = "index.html";

    });

</script>

</body>

</html>
